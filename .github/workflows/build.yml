# Windows / macOS / iOS 必须在对应系统上编译，所以放在 GitHub Actions。
# Android 在自有编译机上编译（签名密钥不上传 GitHub，更安全）。
# 触发：只能手动运行，产物再传到草稿 Release。不能用标签触发：
# publish.sh 发布时才创建标签，会重新编译并覆盖用户已测试过的安装包。
# 域名放在仓库 Secrets（KOYUN_API / KOYUN_WEB，用 tools/encode_domains.py 生成），不写进代码。
# 数据后台（可选，不设置 = 关闭上报）：KOYUN_STATS / KOYUN_STATS_KEY，同样用 encode_domains.py 生成。
# 启动引导配置（Cloudflare Pages / koyunoss）：KOYUN_BOOT / KOYUN_BOOT_PUB / KOYUN_BOOT_KEY，用 tools/bootstrap.py 生成。
name: build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 要编译的平台
        type: choice
        options: [all, windows, macos]
        default: all

env:
  FLUTTER_VERSION: '3.47.9'
  SING_BOX_VERSION: '1.14.4'
  GO_VERSION: '1.26.10'

permissions:
  contents: write

jobs:
  windows:
    if: inputs.platform != 'macos'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 编译
        working-directory: app
        shell: bash
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter gen-l10n
          flutter build windows --release --dart-define=KOYUN_API=${{ secrets.KOYUN_API }} --dart-define=KOYUN_WEB=${{ secrets.KOYUN_WEB }} --dart-define=KOYUN_STATS=${{ secrets.KOYUN_STATS }} --dart-define=KOYUN_STATS_KEY=${{ secrets.KOYUN_STATS_KEY }} --dart-define=KOYUN_BOOT=${{ secrets.KOYUN_BOOT }} --dart-define=KOYUN_BOOT_PUB=${{ secrets.KOYUN_BOOT_PUB }} --dart-define=KOYUN_BOOT_KEY=${{ secrets.KOYUN_BOOT_KEY }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      # 官方内核一切换默认网卡就断开所有连接，这里用打过补丁的内核：旧网卡还能用时保留连接
      - name: 编译并打包内核
        shell: bash
        run: |
          v=${{ env.SING_BOX_VERSION }}
          git -c core.autocrlf=false clone --depth 1 -b "v$v" https://github.com/SagerNet/sing-box.git sb
          tr -d '\r' < tools/singbox-keep-conns.patch | git -C sb apply -
          rel="$PWD/app/build/windows/x64/runner/Release"
          cd sb
          CGO_ENABLED=0 go build -trimpath \
            -tags "with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0" \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=$v-koyun -X runtime.godebugDefault=multipathtcp=0,tlssha1=1 -checklinkname=0 -s -w -buildid=" \
            -o "$rel/sing-box.exe" ./cmd/sing-box
          "$rel/sing-box.exe" version
          ls -la "$rel"
      - name: 安装包
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = (Select-String -Path app/pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $lang = "${env:ProgramFiles(x86)}\Inno Setup 6\Languages\ChineseSimplified.isl"
          if (!(Test-Path $lang)) { Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl" -OutFile $lang }
          & $iscc "/DAppVersion=$ver" "/DSrcDir=$PWD\app\build\windows\x64\runner\Release" "/Odist" app\windows\installer.iss
          Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath "dist/Koyun-$ver-windows-x64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    if: inputs.platform != 'windows'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 编译
        working-directory: app
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter gen-l10n
          flutter build macos --release --dart-define=KOYUN_API=${{ secrets.KOYUN_API }} --dart-define=KOYUN_WEB=${{ secrets.KOYUN_WEB }} --dart-define=KOYUN_STATS=${{ secrets.KOYUN_STATS }} --dart-define=KOYUN_STATS_KEY=${{ secrets.KOYUN_STATS_KEY }} --dart-define=KOYUN_BOOT=${{ secrets.KOYUN_BOOT }} --dart-define=KOYUN_BOOT_PUB=${{ secrets.KOYUN_BOOT_PUB }} --dart-define=KOYUN_BOOT_KEY=${{ secrets.KOYUN_BOOT_KEY }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      # 和 Windows 用同一份打过补丁的内核；同时支持 Intel 和 Apple 芯片
      - name: 编译内核
        run: |
          v=${{ env.SING_BOX_VERSION }}
          git clone --depth 1 -b "v$v" https://github.com/SagerNet/sing-box.git sb
          git -C sb apply - < tools/singbox-keep-conns.patch
          cd sb
          for a in amd64 arm64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$a go build -trimpath \
              -tags "with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0" \
              -ldflags "-X github.com/sagernet/sing-box/constant.Version=$v-koyun -X runtime.godebugDefault=multipathtcp=0,tlssha1=1 -checklinkname=0 -s -w -buildid=" \
              -o "../sing-box-$a" ./cmd/sing-box
          done
          cd ..
          lipo -create sing-box-amd64 sing-box-arm64 -output sing-box
          codesign --force --sign - sing-box
          ./sing-box version
      - name: 打包
        run: |
          APP=app/build/macos/Build/Products/Release/Koyun.app
          cp sing-box "$APP/Contents/Resources/sing-box"
          chmod +x "$APP/Contents/Resources/sing-box"
          # 没有苹果开发者证书，只能临时签名：客户首次打开要到“隐私与安全性”里点“仍要打开”
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          ver=$(grep -E '^version:' app/pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
          mkdir -p dist dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname Koyun -srcfolder dmg -ov -format UDZO "dist/Koyun-$ver-macos-universal.dmg"
      # 从 dmg 里装出来再检查，和客户拿到的文件一致
      - name: 检查安装包
        run: |
          hdiutil attach dist/*.dmg -mountpoint /tmp/koyun-dmg -nobrowse
          cp -R /tmp/koyun-dmg/Koyun.app /Applications/
          hdiutil detach /tmp/koyun-dmg
          APP=/Applications/Koyun.app
          lipo -archs "$APP/Contents/MacOS/Koyun"
          lipo -archs "$APP/Contents/Resources/sing-box"
          codesign --verify --deep --strict "$APP"
          cat > /tmp/kv-test.json <<'JSON'
          {"inbounds":[{"type":"mixed","listen":"127.0.0.1","listen_port":17999}],"outbounds":[{"type":"direct"}]}
          JSON
          "$APP/Contents/Resources/sing-box" run -c /tmp/kv-test.json & core=$!
          sleep 3
          curl -sS -o /dev/null -w '内核代理 HTTP %{http_code}\n' --max-time 20 -x http://127.0.0.1:17999 https://www.apple.com/
          kill $core
          open "$APP"
          sleep 25
          pgrep -x Koyun
          mkdir -p check
          screencapture -x check/launch.png || true
          # 模拟 Cmd+Q，确认能走完退出流程
          osascript -e 'tell application "Koyun" to quit' &
          sleep 15
          if pgrep -x Koyun; then echo "⚠️ 退出后进程还在"; pkill -9 -x Koyun; else echo "退出正常"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-check
          path: check/*
          if-no-files-found: ignore

  # iOS 需要苹果开发者账号才能签名安装，暂时关闭；有账号后把 if 改为 true
  ios:
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: 编译 Libbox.xcframework（sing-box 内核）
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          git clone --depth 1 -b v${{ env.SING_BOX_VERSION }} https://github.com/SagerNet/sing-box.git sb
          cd sb
          gomobile init
          TAGS="with_gvisor,with_quic,with_utls,with_clash_api,with_low_memory,badlinkname,tfogo_checklinkname0"
          LDF="-X github.com/sagernet/sing-box/constant.Version=${{ env.SING_BOX_VERSION }} -s -w -buildid= -checklinkname=0"
          gomobile bind -v -target ios -iosversion 15.0 -libname=box -tags "$TAGS" -trimpath -ldflags "$LDF" -o ../app/ios/Frameworks/Libbox.xcframework ./experimental/libbox
      - name: 加入 VPN 扩展并编译（未签名）
        working-directory: app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          gem install xcodeproj --no-document
          ruby ios/add_packet_tunnel.rb
          flutter pub get
          dart run flutter_launcher_icons
          flutter gen-l10n
          flutter build ios --release --no-codesign --dart-define=KOYUN_API=${{ secrets.KOYUN_API }} --dart-define=KOYUN_WEB=${{ secrets.KOYUN_WEB }} --dart-define=KOYUN_STATS=${{ secrets.KOYUN_STATS }} --dart-define=KOYUN_STATS_KEY=${{ secrets.KOYUN_STATS_KEY }} --dart-define=KOYUN_BOOT=${{ secrets.KOYUN_BOOT }} --dart-define=KOYUN_BOOT_PUB=${{ secrets.KOYUN_BOOT_PUB }} --dart-define=KOYUN_BOOT_KEY=${{ secrets.KOYUN_BOOT_KEY }}
          ver=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
          mkdir -p ../dist Payload && cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr "../dist/Koyun-$ver-ios-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*
